name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.sdk == 'current' && format('test ({0})', matrix.python-version) || format('test ({0}, {1})', matrix.python-version, matrix.sdk) }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        sdk: ["current"]
        include:
          - python-version: "3.11"
            sdk: "2.1.1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,performance]"

      - name: Install supported SDK floor
        if: matrix.sdk != 'current'
        run: pip install "mcp==${{ matrix.sdk }}"

      - name: Lint
        run: ruff check src/ tests/

      - name: Format check
        run: ruff format --check src/ tests/

      - name: Test
        run: pytest -v

      - name: Check generated native Skills
        run: python -m simba_mcp.guidance --check

      - name: Verify guidance in built wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir .codex/wheel
          python -I tests/guidance/wheel_smoke.py .codex/wheel

      - name: Check generated reference
        run: python -m simba_mcp.reference --check

      - name: Evaluate synthetic workflow contracts
        run: |
          python -m simba_mcp.evaluation --samples 3 --description-mode legacy --output-dir .codex/evaluation/legacy
          python -m simba_mcp.evaluation --samples 3 --description-mode compact --output-dir .codex/evaluation/compact

      - name: Retain workflow evidence
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-${{ matrix.python-version }}-${{ matrix.sdk }}
          path: .codex/evaluation/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Capture synthetic performance baseline
        if: matrix.python-version == '3.11'
        run: |
          python -m simba_mcp.performance --encoding o200k_base --output-dir .codex/performance-baseline
          python -m simba_mcp.performance --encoding o200k_base --description-mode compact --output-dir .codex/performance-baseline/compact
          python -m simba_mcp.benchmark --samples 30 --output-dir .codex/performance-baseline

      - name: Retain baseline evidence
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: performance-${{ matrix.sdk }}
          path: .codex/performance-baseline/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
