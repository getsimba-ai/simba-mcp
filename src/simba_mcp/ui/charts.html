<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Simba result charts</title>
<style>
:root{color-scheme:light dark;--bg:var(--color-background-primary,#fff);--fg:var(--color-text-primary,#334155);--muted:var(--color-text-secondary,#64748b);--border:var(--color-border-primary,#cbd5e1);--soft:var(--color-background-secondary,#f1f5f9)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px Inter,system-ui,sans-serif}main{padding:24px;max-width:1200px;margin:auto}h1{font-size:24px;margin:0 0 16px}h2{font-size:18px;margin:24px 0 12px}p{line-height:1.6;margin:12px 0}.eyebrow{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}.note{padding:16px;background:var(--soft);border-radius:8px}.error{border-left:4px solid #ef4444}.legend{display:flex;gap:16px;flex-wrap:wrap;margin:16px 0}.key{display:inline-flex;gap:8px;align-items:center}.swatch{width:24px;border-top:3px solid currentColor}.band{height:12px;border:0;background:currentColor;opacity:.2}.outer{opacity:.12;border:1px solid currentColor}.inner{opacity:.3;border:2px solid currentColor}.dash{border-top-style:dashed}label{display:flex;align-items:center;gap:16px;margin:16px 0}select{font:inherit;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);max-width:100%}select:focus-visible,summary:focus-visible{outline:3px solid #3b82f6;outline-offset:4px}.plot{height:420px;width:100%;display:block}.plot text{fill:var(--muted);font-family:inherit;font-size:12px}.scroll{overflow:auto;max-height:400px}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{text-align:right;padding:12px;white-space:nowrap;border-bottom:1px solid var(--border)}th:first-child,td:first-child{text-align:left}th{position:sticky;top:0;background:var(--bg)}summary{cursor:pointer;padding:12px 0;font-weight:600}.reconciliation{border-left:4px solid var(--muted);padding-left:16px;margin-top:24px}small{color:var(--muted)}@media(max-width:600px){main{padding:16px}h1{font-size:20px}.plot{height:420px}}
</style></head><body><main id="root" aria-live="polite"><p class="eyebrow">Simba results</p><h1>Waiting for result data</h1><p>The host will provide the requested saved results. This view makes no network requests.</p></main>
<script>
'use strict';
const root=document.getElementById('root'),NS='http://www.w3.org/2000/svg';
const colours=['#3b82f6','#ef4444','#10b981','#f59e0b','#8b5cf6','#06b6d4','#f97316','#84cc16'];
const finite=v=>typeof v==='number'&&Number.isFinite(v), fmt=v=>v==null?'Unavailable':typeof v==='number'&&!finite(v)?'Unavailable':String(v);
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
const labels={Channel:'Channel',Spend:'Spend',OptimalSpend:'Allocated spend',HistoricalSpend:'Historical spend',Revenue:'Decision revenue',ROI:'Decision ROI',ObjectiveMarginal:'Objective marginal return',OptimizedEvalRevenue:'Comparison revenue',OptimizedEvalROI:'Comparison ROI',HistoricalRevenue:'Historical revenue',HistoricalROI:'Historical ROI'};
const add=(tag,text,cls)=>{const e=el(tag,text,cls);root.append(e);return e};
const svgEl=(tag,attrs)=>{const e=document.createElementNS(NS,tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,String(v));return e};
const note=text=>add('p',text,'note');
const date=v=>{if(v==null)return 'Unavailable';const d=new Date(v);return Number.isNaN(d.valueOf())?String(v):d.toISOString().slice(0,10)};
const windowLabel=key=>labels[key]||key;
function table(parent,rows,keys,labels){const wrap=el('div',undefined,'scroll'),t=el('table'),head=el('thead'),tr=el('tr');keys.forEach((k,i)=>{const th=el('th',labels?.[i]||windowLabel(k));th.title='Served field: '+k;tr.append(th)});head.append(tr);t.append(head);const body=el('tbody');rows.forEach(r=>{const line=el('tr');keys.forEach(k=>line.append(el('td',k==='Date'?date(r[k]):fmt(r[k]))));body.append(line)});t.append(body);wrap.append(t);parent.append(wrap)}
function values(rows,keys,labels){const d=add('details');d.append(el('summary','Inspect exact served values'));table(d,rows,keys,labels)}
function legend(parent,items){const l=el('div',undefined,'legend');items.forEach(({name,colour,kind})=>{const item=el('span',undefined,'key'),sw=el('span',undefined,'swatch '+(kind||''));sw.style.color=colour;item.append(sw,el('span',name));l.append(item)});parent.append(l)}
function chart(parent,series,{xlabel,ylabel,marker,bands=[],time=false}={}){
 const points=series.flatMap(s=>s.points).concat(bands.flatMap(b=>b.lower.concat(b.upper))).filter(p=>finite(p[0])&&finite(p[1]));
 if(!points.length){parent.append(el('p','No finite served points are available.','note'));return}
 const width=900,height=420,pad={l:80,r:24,t:24,b:64};let xmin=Math.min(...points.map(p=>p[0])),xmax=Math.max(...points.map(p=>p[0])),ymin=Math.min(0,...points.map(p=>p[1])),ymax=Math.max(0,...points.map(p=>p[1]));
 if(xmin===xmax)xmax=xmin+1;if(ymin===ymax)ymax=ymin+1;
 const x=v=>pad.l+(v-xmin)/(xmax-xmin)*(width-pad.l-pad.r),y=v=>height-pad.b-(v-ymin)/(ymax-ymin)*(height-pad.t-pad.b);
 const svg=svgEl('svg',{viewBox:`0 0 ${width} ${height}`,class:'plot',role:'img','aria-label':`${ylabel} by ${xlabel}`});
 svg.append(svgEl('path',{d:`M${pad.l} ${pad.t}V${height-pad.b}H${width-pad.r}`,fill:'none',stroke:'var(--border)','stroke-width':1.5}));
 const tick=v=>Math.abs(v)>=1000000?(v/1000000).toFixed(1)+'M':Math.abs(v)>=1000?(v/1000).toFixed(1)+'k':v.toLocaleString('en-GB',{maximumFractionDigits:2});
 for(let i=0;i<5;i++){const xv=xmin+i*(xmax-xmin)/4,yv=ymin+i*(ymax-ymin)/4;let t=svgEl('text',{x:x(xv),y:height-pad.b+24,'text-anchor':'middle'});t.textContent=time?date(xv):tick(xv);svg.append(t);t=svgEl('text',{x:pad.l-12,y:y(yv)+4,'text-anchor':'end'});t.textContent=tick(yv);svg.append(t)}
 let t=svgEl('text',{x:width/2,y:height-12,'text-anchor':'middle'});t.textContent=xlabel;svg.append(t);t=svgEl('text',{x:pad.l,y:16});t.textContent=ylabel;svg.append(t);
 const path=points=>{let open=false;return points.map(p=>{if(!finite(p[0])||!finite(p[1])){open=false;return ''}const cmd=open?'L':'M';open=true;return `${cmd}${x(p[0])} ${y(p[1])}`}).join(' ')};
 bands.forEach(b=>{let segment=[];const flush=()=>{if(segment.length>1){const top=segment.map(i=>[b.upper[i][0],b.upper[i][1]]),bottom=segment.map(i=>[b.lower[i][0],b.lower[i][1]]).reverse();svg.append(svgEl('path',{d:path(top)+' '+path(bottom).replace(/^M/,'L')+' Z',fill:b.colour,opacity:b.opacity,'data-role':'uncertainty-band'}))}segment=[]};b.lower.forEach((p,i)=>{const upper=b.upper[i];if(finite(p[0])&&finite(p[1])&&upper&&finite(upper[1]))segment.push(i);else flush()});flush()});
 series.forEach(s=>{svg.append(svgEl('path',{d:path(s.points),fill:'none',stroke:s.colour,'stroke-width':3,'data-series':s.name}));s.points.filter(p=>finite(p[0])&&finite(p[1])).forEach(p=>{const dot=svgEl('circle',{cx:x(p[0]),cy:y(p[1]),r:2,fill:s.colour});const tip=svgEl('title',{});tip.textContent=`${s.name}: ${time?date(p[0]):fmt(p[0])}, ${fmt(p[1])}`;dot.append(tip);svg.append(dot)})});
 if(finite(marker)&&marker>=xmin&&marker<=xmax)svg.append(svgEl('path',{d:`M${x(marker)} ${pad.t}V${height-pad.b}`,stroke:'#64748b','stroke-width':1.5,'stroke-dasharray':'6 4','data-role':'current-spend'}));
 parent.append(svg)
}
function configOf(data){return data.model_config&&typeof data.model_config==='object'?data.model_config:{}}
function curves(data){add('p','Response curves','eyebrow');add('h1','How spend relates to revenue');const cfg=configOf(data),currency=cfg.config?.currency||'currency unavailable';note(`Served response curves. ${currency}. Curve basis: ${({'level_minus_channel':'Change in fitted outcome when this channel is removed',mean_fitted_mu_excluding_channel_training_window:'Mean fitted outcome excluding this channel',additive_outcome:'Additive outcome'})[cfg.curve_reference_level]||cfg.curve_reference_level||'not supplied'}. Current spend is not a recommended allocation.`);
 const rows=Array.isArray(data.response_curves)?data.response_curves:[];const suffix=/_lower(?:_50)?$|_upper(?:_50)?$/;const keys=[...new Set(rows.flatMap(Object.keys))].filter(k=>k!=='Spend'&&!suffix.test(k)&&k!=='Overlap');if(!keys.length){note('Response curves are unavailable for this result.');return}
 const label=add('label','Channel'),select=el('select');select.setAttribute('aria-label','Response curve channel');keys.forEach(k=>{const o=el('option',k);o.value=k;select.append(o)});label.append(select);const region=add('section');
 function draw(){region.replaceChildren();const ch=select.value,colour=colours[keys.indexOf(ch)%colours.length],points=rows.map(r=>[r.Spend,r[ch]]),count=points.filter(p=>finite(p[0])&&finite(p[1])).length;const summary=data.mroi_summary?.channels||[],mapping=(data.channel_map||[]).find(r=>r.activity_column===ch);const current=summary.find(r=>r.channel===ch||r.channel===mapping?.channel)?.current_spend;
 const bands=[];for(const [lo,hi,name,opacity]of [['_lower','_upper','Outer served band',.12],['_lower_50','_upper_50','Inner served band',.22]])if(rows.some(r=>finite(r[ch+lo])&&finite(r[ch+hi])))bands.push({lower:rows.map(r=>[r.Spend,r[ch+lo]]),upper:rows.map(r=>[r.Spend,r[ch+hi]]),colour,opacity,name});
 legend(region,[{name:ch+' mean',colour},...bands.map(b=>({name:b.name,colour,kind:b.opacity===.12?'band outer':'band inner'})),...(finite(current)?[{name:'Current spend '+fmt(current),colour:'#64748b',kind:'dash'}]:[])]);
 if(count<3)region.append(el('p',`Insufficient curve resolution: ${count} finite points. A new fitted artifact is needed to recover missing resolution; this view cannot backfill it.`,'note'));
 if(!finite(current))region.append(el('p','Current spend unavailable. No marker has been invented.','note'));
 chart(region,[{name:ch,colour,points}],{xlabel:`Spend (${currency})`,ylabel:'Served revenue',marker:current,bands});
 const d=el('details');d.append(el('summary','Inspect exact served values'));table(d,rows,['Spend',ch,...['_lower','_lower_50','_upper_50','_upper'].map(s=>ch+s).filter(k=>rows.some(r=>k in r))]);region.append(d);resize()}
 select.addEventListener('change',draw);draw()
}
function decomposition(data){add('p','Decomposition','eyebrow');add('h1','What contributed to the outcome');const cfg=configOf(data);note(`KPI units, not revenue. Attribution: ${cfg.attribution_convention||'not supplied'}. Controls and baseline are components, not paid-media channels.`);const rows=Array.isArray(data.contributions)?data.contributions:[];if(!rows.length){note('Contribution series are unavailable.');return}
 const keys=[...new Set(rows.flatMap(Object.keys))].filter(k=>!['Date','period_start','period_end','Overlap','Model','Fit Actual','Actual'].includes(k));
 const label=add('label','Component'),select=el('select');select.setAttribute('aria-label','Contribution component');keys.forEach(k=>{const o=el('option',k);o.value=k;select.append(o)});label.append(select);const region=add('section');function draw(){region.replaceChildren();const ch=select.value,colour=colours[keys.indexOf(ch)%colours.length];legend(region,[{name:ch,colour}]);chart(region,[{name:ch,colour,points:rows.map(r=>[new Date(r.Date??r.period_start).valueOf(),r[ch]])}],{xlabel:'Date',ylabel:'KPI units',time:true});resize()}select.addEventListener('change',draw);if(keys.length)draw();
 values(rows,['Date',...keys]);if(rows.some(r=>'Overlap'in r)){const panel=add('section',undefined,'reconciliation');panel.append(el('h2','Reconciliation: Overlap'),el('p','Shared synergy reconciliation. This is not a channel and must not be ranked or allocated budget.'));table(panel,rows,['Date','Overlap'])}
 const actualKeys=['Model','Fit Actual','Actual'].filter(k=>rows.some(r=>k in r));if(actualKeys.length){add('h2','Model and observed outcome');values(rows,['Date',...actualKeys])}
}
function allocation(payload){add('p','Saved allocation','eyebrow');add('h1','Inspect the budget decision');const status=payload.status||payload.optimizer_status;if(status&&status!=='complete'){note(`Result status: ${status}. ${payload.progress_text||'Completed allocation results are not available.'}`);return}const rows=Array.isArray(payload.results)?payload.results:[];if(!rows.length){note('No saved allocation rows are available.');return}const inputs=payload.inputs||{};note(`Run: ${payload.run_id||'latest model result'}. Currency: ${inputs.currency||'not supplied'}. Period: ${inputs.start_date||'not supplied'} to ${inputs.end_date||'not supplied'}. No figures are recalculated in this view.`);
 add('h2','Allocated and historical spend');const channelRows=rows.filter(r=>String(r.Channel).toLowerCase()!=='total');legend(root,[{name:'Allocated spend',colour:colours[0]},{name:'Historical spend',colour:'#64748b'}]);
 const max=Math.max(...channelRows.flatMap(r=>[r.OptimalSpend,r.HistoricalSpend]).filter(finite),0);if(max>0){const svg=svgEl('svg',{viewBox:`0 0 900 ${Math.max(180,channelRows.length*64+56)}`,class:'plot',role:'img','aria-label':'Allocated and historical spend by channel'});channelRows.forEach((r,i)=>{const text=svgEl('text',{x:8,y:32+i*64});text.textContent=r.Channel;svg.append(text);[['OptimalSpend',colours[0]],['HistoricalSpend','#64748b']].forEach(([k,c],j)=>{if(!finite(r[k]))return;const bar=svgEl('rect',{x:220,y:12+i*64+j*20,width:Math.max(0,r[k])/max*600,height:16,fill:c});const tip=svgEl('title',{});tip.textContent=`${r.Channel}, ${k}: ${fmt(r[k])}`;bar.append(tip);svg.append(bar)})});for(let i=0;i<5;i++){const t=svgEl('text',{x:220+i*150,y:channelRows.length*64+32,'text-anchor':'middle'});t.textContent=fmt(max*i/4);svg.append(t)}root.append(svg)}
 table(root,rows,['Channel','OptimalSpend','HistoricalSpend']);add('h2','Decision quantities');add('p','Removal-lift counterfactual quantities used by the solver. These are not the accounting comparison.');table(root,rows,['Channel','Revenue','ROI','ObjectiveMarginal']);add('h2','Comparison quantities');add('p','Fitted-convention accounting at the saved spends. Read these separately from decision quantities.');table(root,rows,['Channel','OptimizedEvalRevenue','OptimizedEvalROI','HistoricalRevenue','HistoricalROI']);
}
function render(result){root.replaceChildren();const payload=result?.structuredContent;if(result?.isError||payload?.error){add('h1','Results unavailable');note(payload?.error||'The tool reported an error. Use its text response for details.');resize();return}if(!payload||typeof payload!=='object'){add('h1','No structured result available');note('Use the tool text response. This view does not invent missing values.');resize();return}const data=payload.results&&!Array.isArray(payload.results)&&typeof payload.results==='object'?payload.results:payload;try{if('response_curves'in data)curves(data);else if('contributions'in data)decomposition(data);else allocation(payload)}catch(e){root.replaceChildren();add('h1','This result could not be displayed');note('The result shape is unsupported. The original tool response remains available.')}resize()}
function send(message){if(window.parent!==window)window.parent.postMessage({jsonrpc:'2.0',...message},'*')}
function resize(){send({method:'ui/notifications/size-changed',params:{height:document.documentElement.scrollHeight}})}
window.addEventListener('message',event=>{if(event.source!==window.parent)return;const m=event.data;if(!m||m.jsonrpc!=='2.0')return;if(m.id===1&&m.result){send({method:'ui/notifications/initialized',params:{}});resize()}if(m.method==='ui/notifications/tool-result')render(m.params);if(m.method==='ui/resource-teardown')send({id:m.id,result:{}})});
send({id:1,method:'ui/initialize',params:{appInfo:{name:'Simba result charts',version:'1.0.0'},appCapabilities:{},protocolVersion:'2026-01-26'}});
</script></body></html>
